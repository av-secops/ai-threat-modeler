# A platform describes how a component is built, not a component of its own.
# "An iOS mobile app" is one client, not a client plus an operating system, so
# the platform is folded into the component whose description mentions it.
#
#   hosts    the component types this platform can describe. A platform is only
#            folded into a host of one of these types, so a React node never
#            collapses into a database.
#   display  the accepted spelling, used on the merged label. Without it the
#            diagram reads "Mobile App (Ios)".
platforms:
  ios:
    hosts: [Mobile App]
    display: iOS
  android:
    hosts: [Mobile App]
    display: Android
  react native:
    hosts: [Mobile App]
    display: React Native
  flutter:
    hosts: [Mobile App]
  swift:
    hosts: [Mobile App]
  kotlin:
    hosts: [Mobile App]
  react:
    hosts: [WebClient]
  vue:
    hosts: [WebClient]
    display: Vue
  angular:
    hosts: [WebClient]
  svelte:
    hosts: [WebClient]
  next.js:
    hosts: [WebClient]
    display: Next.js
  nextjs:
    hosts: [WebClient]
    display: Next.js
  django:
    hosts: [API, Service]
  flask:
    hosts: [API, Service]
  fastapi:
    hosts: [API, Service]
    display: FastAPI
  express:
    hosts: [API, Service]
  spring boot:
    hosts: [API, Service]
    display: Spring Boot
  spring:
    hosts: [API, Service]
    display: Spring
  node.js:
    hosts: [API, Service]
    display: Node.js
  nodejs:
    hosts: [API, Service]
    display: Node.js
