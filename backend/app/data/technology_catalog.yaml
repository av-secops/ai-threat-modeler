# Which technologies the extractor recognizes, and what each one is.
#
# This is the one place a vendor is taught to the tool. The same knowledge used
# to live in three Python modules, so adding a database meant editing the
# extractor, the challenger that decides whether a term was missed, and the pass
# that merges duplicate nodes, and forgetting any of the three produced a model
# that was wrong in a way nobody could see. Adding a technology here is enough.
#
# Order carries no meaning. Terms are matched longest first, so "azure openai"
# resolves to itself rather than to "openai", regardless of where it appears.
#
# Terms are lowercase because the text is lowercased before matching, and they
# are matched on word boundaries, so "s3" is not found inside "s3cret".

version: technology-catalog-1.0

